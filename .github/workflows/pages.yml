name: Deploy read-only site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CVA_BASE: /${{ github.event.repository.name }}/
          VITE_STATIC: '1'
          # Which exams the site shows. Set the repository variable CVA_EXAMS (Settings > Secrets and variables >
          # Actions > Variables), e.g. "az-104,az-305" or "all". Default: AZ-104 only.
          VITE_EXAMS: ${{ vars.CVA_EXAMS || 'az-104' }}
      # Pages has no SPA routing; serving index.html as 404 makes lesson links open directly.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
